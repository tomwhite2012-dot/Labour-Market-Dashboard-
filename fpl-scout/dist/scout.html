<style>
/* Layout: a mown pitch is the stage (chief in the centre circle, 20 club scouts round the touchline);
   the written report sits underneath like a printed team sheet. */
:root {
  --bg: #eef2ea; --surface: #ffffff; --surface-2: #f6f8f3; --ink: #142019; --muted: #56675b; --line: #d5ddd1;
  --accent: #e8b511; --accent-ink: #2a2100; --good: #1b7f47; --warn: #a86f00; --bad: #b8392a; --info: #2c5d9e;

  --pitch-a: #2e7d3b; --pitch-b: #297235; --pitch-line: rgba(255,255,255,.75); --chip: rgba(10,25,14,.78); --chip-ink: #ffffff;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --shadow: 0 10px 30px rgba(10,30,15,.18);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1410; --surface: #152019; --surface-2: #1a271f; --ink: #e5eee7; --muted: #9db0a2; --line: #2a3a30;
  --accent: #f0c232; --accent-ink: #231b00; --good: #4cc483; --warn: #e6ad3a; --bad: #f07b69; --info: #7eaaf0;
  --good-bg: #173527; --warn-bg: #3a2e12; --bad-bg: #3d1d18; --info-bg: #182a44;
  --pitch-a: #23602d; --pitch-b: #1f5728; --pitch-line: rgba(255,255,255,.6); --chip: rgba(5,12,8,.82); --chip-ink: #ffffff;
  --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1410; --surface: #152019; --surface-2: #1a271f; --ink: #e5eee7; --muted: #9db0a2; --line: #2a3a30;
  --accent: #f0c232; --accent-ink: #231b00; --good: #4cc483; --warn: #e6ad3a; --bad: #f07b69; --info: #7eaaf0;
  --good-bg: #173527; --warn-bg: #3a2e12; --bad-bg: #3d1d18; --info-bg: #182a44;
  --pitch-a: #23602d; --pitch-b: #1f5728; --pitch-line: rgba(255,255,255,.6); --chip: rgba(5,12,8,.82); --chip-ink: #ffffff;
  --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 16px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); letter-spacing: .01em; text-wrap: balance; margin: 0; }
a { color: var(--info); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; margin-bottom: 14px; }
.top h1 { font-size: clamp(28px, 4.6vw, 44px); font-weight: 800; text-transform: uppercase; line-height: .95; }
.top .eyebrow { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .12em; font-size: 13px; color: var(--muted); }
.clocks { display: flex; flex-wrap: wrap; gap: 8px; }
.clock { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; min-width: 0; }
.clock b { display: block; font-family: var(--display); font-size: 18px; font-weight: 700; }
.clock span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.clock.hot { border-color: var(--accent); }

/* pitch */
.pitch { position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow);
  background: repeating-linear-gradient(90deg, var(--pitch-a) 0 6.25%, var(--pitch-b) 6.25% 12.5%); }
.pitch svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.pitch svg.lines * { fill: none; stroke: var(--pitch-line); stroke-width: 2; vector-effect: non-scaling-stroke; }
.pitch svg.lines .spot { fill: var(--pitch-line); stroke: none; }
.lines.portrait { display: none; }
.scout { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: none; border: 0; padding: 0; cursor: pointer; width: clamp(54px, 8.4vw, 96px); }
.scout svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 5px 6px rgba(0,0,0,.35)); transition: transform .15s ease; }
.scout:hover svg, .scout:focus-visible svg { transform: translateY(-3px) scale(1.06); }
.scout .tag { font-family: var(--display); font-weight: 700; font-size: clamp(11px, 1.2vw, 14px); letter-spacing: .04em; text-transform: uppercase;
  color: var(--chip-ink); background: var(--chip); border-radius: 4px; padding: 1px 6px; white-space: nowrap; line-height: 1.3; }
.scout .tag .full { display: inline; } .scout .tag .short { display: none; }
.scout .dot { position: absolute; top: 2%; right: 8%; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: var(--accent-ink);
  font: 700 11px/18px var(--display); text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
.scout .dot.free { background: #ffffff; color: #1b5e2f; }
.scout.active svg { transform: scale(1.1); }
.chief { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(46%, 470px); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.chief-btn { background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.chief-btn svg { width: clamp(84px, 13vw, 150px); height: auto; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
.chief-name { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: #fff; font-size: clamp(13px, 1.6vw, 18px);
  background: var(--chip); padding: 1px 10px; border-radius: 4px; }
.bubble { position: relative; background: #fffef6; color: #1b1a12; border-radius: 12px; padding: 10px 14px; font-size: clamp(12px, 1.25vw, 15px); line-height: 1.4;
  box-shadow: 0 6px 16px rgba(0,0,0,.25); max-width: 100%; }
.bubble::before { content: ""; position: absolute; top: -8px; left: 50%; margin-left: -8px; border: 8px solid transparent; border-top: 0; border-bottom-color: #fffef6; }
.bubble .verdict { font-family: var(--display); font-weight: 800; font-size: 1.25em; text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; }
.bubble .verdict.swap { color: #a3560a; } .bubble .verdict.hold { color: #1b6e3e; }
.bubble .hint { display: block; margin-top: 4px; font-size: .85em; color: #5c5a48; }

/* portrait animation */
.head .lid { transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); animation: blink 5.2s infinite; }
.head .pupil { animation: look 9s infinite ease-in-out; }
.head .mouth-open { transform-box: fill-box; transform-origin: 50% 30%; opacity: 0; }
.head.talking .mouth-open { opacity: 1; animation: talk .2s infinite alternate ease-in-out; }
.head.talking .mouth-closed { opacity: 0; }
.head.talking .brow { animation: brow .6s infinite alternate ease-in-out; }
.head.talking .pupil { animation: none; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(0); } 96.5% { transform: scaleY(1); } }
@keyframes look { 0%, 30% { transform: translate(0, 0); } 36%, 52% { transform: translate(2px, 0); } 58%, 74% { transform: translate(-2px, 1px); } 80%, 100% { transform: translate(0, 0); } }
@keyframes talk { from { transform: scaleY(.25); } to { transform: scaleY(1.05); } }
@keyframes brow { from { transform: translateY(0); } to { transform: translateY(-2px); } }
@media (prefers-reduced-motion: reduce) { .head *, .head.talking * { animation: none !important; } .head.talking .mouth-open { opacity: 1; } }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(5,12,8,.45); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--bg); z-index: 21; overflow-y: auto; box-shadow: var(--shadow);
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) 18px; }
.drawer-head { display: grid; grid-template-columns: 88px 1fr auto; gap: 12px; align-items: center; margin-bottom: 14px; }
.drawer-head svg { width: 88px; height: auto; }
.drawer-head h2 { font-size: 26px; font-weight: 800; text-transform: uppercase; line-height: 1; }
.drawer-head p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.close { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 20px; line-height: 1; align-self: start; }
.say { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 12px; margin: 0 0 14px; }

/* sections & cards */
section.block { margin-top: 22px; }
.block > h2 { font-size: 24px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; }
.sub { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 15px; color: var(--muted); margin: 18px 0 8px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 2px solid var(--line); margin-top: 22px; scrollbar-width: thin; }
.tab { font-family: var(--display); font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: .04em; padding: 8px 14px; border: 0; background: none;
  color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panel { padding-top: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.card h3 { font-size: 20px; font-weight: 700; text-transform: uppercase; }
.verdict-card { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; }
.vbadge { font-family: var(--display); font-weight: 800; font-size: 38px; line-height: 1; text-transform: uppercase; padding: 8px 14px; border-radius: 8px; }
.vbadge.swap { background: var(--accent); color: var(--accent-ink); } .vbadge.hold { background: var(--good-bg); color: var(--good); }
.move { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.move .side { min-width: 0; }
.move .side small { display: block; font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
.move .out small { color: var(--bad); } .move .in small { color: var(--good); }
.move .pname { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.1; }
.move .arrow { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--muted); }
.gain { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--good); }
.gain.neg { color: var(--bad); }
.kv { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.kv b { color: var(--ink); font-weight: 600; }
.pill { display: inline-block; font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; padding: 0 7px; border-radius: 999px; line-height: 20px; white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.info { background: var(--info-bg); color: var(--info); }
.pill.me { background: var(--accent); color: var(--accent-ink); } .pill.plain { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.fixtures { display: flex; flex-wrap: wrap; gap: 6px; }
.fx { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 96px; }
.fx b { font-family: var(--display); font-size: 18px; } .fx div { font-size: 12px; color: var(--muted); }
.claim { border-top: 1px solid var(--line); padding: 10px 0; }
.claim:first-child { border-top: 0; }
.claim p { margin: 4px 0; }
.claim .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.empty { background: var(--surface-2); border: 1px dashed var(--line); border-radius: 8px; padding: 12px; color: var(--muted); font-size: 14px; }
.xi { display: flex; flex-direction: column; gap: 8px; }
.xi-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.xi-p { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; text-align: center; min-width: 74px; }
.xi-p b { display: block; font-family: var(--display); font-size: 15px; line-height: 1.15; }
.xi-p span { font-size: 11px; color: var(--muted); }
.xi-p.new { border-color: var(--good); background: var(--good-bg); }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 7px 9px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 12.5px; color: var(--muted); background: var(--surface-2); position: sticky; top: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td.name b { font-weight: 600; }
td.news { white-space: normal; min-width: 180px; font-size: 12.5px; color: var(--muted); }
.range { font-size: 11px; color: var(--muted); font-weight: 400; }
.xpbar { display: inline-block; height: 6px; border-radius: 3px; background: var(--good); vertical-align: middle; margin-left: 6px; opacity: .75; }
tr.me td { background: var(--warn-bg); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; cursor: pointer; font-family: var(--display); font-weight: 700; text-transform: uppercase; font-size: 14px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
ul.plain { margin: 6px 0; padding-left: 18px; }
footer { margin-top: 30px; font-size: 12.5px; color: var(--muted); }

@media (max-width: 720px) {
  .pitch { aspect-ratio: 10 / 16; background: repeating-linear-gradient(180deg, var(--pitch-a) 0 6.25%, var(--pitch-b) 6.25% 12.5%); }
  .lines.landscape { display: none; } .lines.portrait { display: block; }
  .scout { width: clamp(42px, 12.5vw, 58px); }
  .scout .tag .full { display: none; } .scout .tag .short { display: inline; }
  .chief { width: 62%; }
  .bubble .line2 { display: none; }
  .drawer-head { grid-template-columns: 64px 1fr auto; } .drawer-head svg { width: 64px; } .drawer-head h2 { font-size: 22px; }
  .move .pname { font-size: 18px; }
}
</style>

function scoutLook(club) {

/* ---------- small renderers ---------- */
function ownerPill(p) {
  if (p.owner === ME) return '<span class="pill me">Your squad</span>';
  if (p.owner == null) return '<span class="pill good">Free agent</span>';
  return `<span class="pill plain">${esc(p.owner_name)}</span>`;
}
function setPieceChips(p) {
  const s = p.set_pieces || {}, out = [];
  if (s.penalties) out.push(`<span class="pill ${s.penalties === 1 ? "warn" : "plain"}" title="Penalty order">Pens ${s.penalties}</span>`);
  if (s.corners) out.push(`<span class="pill plain" title="Corners and indirect free kicks order">Corners ${s.corners}</span>`);
  if (s.free_kicks) out.push(`<span class="pill plain" title="Direct free kicks order">FKs ${s.free_kicks}</span>`);
  return out.join(" ") || '<span class="muted">–</span>';
}
function statusPill(p) {
  if (p.status === "a" || !p.status) return "";
  const map = { d: ["warn", (p.chance != null ? p.chance + "%" : "Doubt")], i: ["bad", "Injured"], s: ["bad", "Suspended"], u: ["bad", "Unavailable"], n: ["bad", "Ineligible"] };
  const m = map[p.status] || ["plain", p.status];
  return ` <span class="pill ${m[0]}">${esc(m[1])}</span>`;
}
function fixtureLabel(f) { return `${f.opp}${f.home ? " (H)" : " (A)"}`; }
function playerTable(ids, opts = {}) {
  const maxXp = Math.max(1, ...ids.map(id => pl(id) ? pl(id).xp_total : 0));
  const gws = R.meta.horizon;
  const rows = ids.map(id => {
    const p = pl(id); if (!p) return "";
    const lock = p.locked ? ' <span class="pill info" title="Locked: never dropped. In Draft a dropped star is lost to a rival for the season.">Locked</span>' : "";
    const fx = p.gws.map(g => `<td class="r" title="${esc(g.fixtures.map(fixtureLabel).join(" + ") || "No fixture")}">${f1(g.xp)}</td>`).join("");
    return `<tr${p.owner === ME && opts.markMine ? ' class="me"' : ""}>
      <td class="name"><b>${esc(p.name)}</b>${statusPill(p)}${lock}<div class="muted" style="font-size:12px">${esc(p.team)} · ${p.pos}</div></td>
      ${opts.owner !== false ? `<td>${ownerPill(p)}</td>` : ""}
      ${fx}
      <td class="r"><b>${f1(p.xp_total)}</b><span class="xpbar" style="width:${Math.round(40 * p.xp_total / maxXp)}px"></span>${p.range ? `<div class="range" title="80% of simulated outcomes fall in this range">${p.range[0]}–${p.range[2]}</div>` : ""}</td>
      <td class="r" title="Weighted ${R.chief.view.length}-gameweek view: nearer gameweeks count more">${f1(p.xp_view)}</td>
      <td class="r" title="FPL's own expected points for next gameweek: an independent second opinion">${p.fpl_ep == null ? "–" : f1(p.fpl_ep)}</td>
      <td class="r">${pct(p.p_start_next)}</td>
      <td class="r">${Math.round(p.gws[0] ? p.gws[0].e_mins : 0)}</td>
      <td class="r">${pct(p.p_return_next)}</td>
      <td>${setPieceChips(p)}</td>
      <td class="r">${p.season.pts}</td>
      <td class="r">${f1(p.season.xg)} / ${f1(p.season.xa)}</td>
      ${opts.news !== false ? `<td class="news">${esc(p.news || p.risks.join(" ") || "")}</td>` : ""}
    </tr>`;
  }).join("");
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>Player</th>${opts.owner !== false ? "<th>Owner</th>" : ""}
      ${gws.map(g => `<th class="r">GW${g} xP</th>`).join("")}<th class="r" title="Expected points, with the 10th–90th percentile range of 2,000 simulations underneath">${gws.length}-GW xP</th>
      <th class="r" title="Weighted ${R.chief.view.length}-gameweek view (GW${R.chief.view[0]}–${R.chief.view[R.chief.view.length - 1]}, weights ${R.chief.view_weights.join(", ")})">${R.chief.view.length}-GW view</th>
      <th class="r" title="FPL's own expected points for GW${R.meta.next_gw}">FPL GW${R.meta.next_gw}</th>
      <th class="r" title="Chance of starting next gameweek">Start</th><th class="r" title="Expected minutes next gameweek">Mins</th>
      <th class="r" title="Chance of a goal or assist next gameweek">G/A</th><th>Set pieces</th><th class="r">Pts</th><th class="r">xG / xA</th>
      ${opts.news !== false ? "<th>News</th>" : ""}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
function claimList(claims, emptyMsg) {
  if (!claims || !claims.length) return `<div class="empty">${emptyMsg}</div>`;
  const tagMap = { confirmed: ["good", "Confirmed"], rumour: ["warn", "Rumour"], fan_speculation: ["info", "Fan speculation"] };
  return `<div class="card">${claims.map(c => {
    const t = tagMap[c.tag] || ["plain", c.tag];
    return `<div class="claim"><div class="meta"><span class="pill ${t[0]}">${t[1]}</span>${c.player ? `<b style="color:var(--ink)">${esc(c.player)}</b>` : ""}<span>${esc(c.date || "")}</span></div>
      <p>${esc(c.text)}</p><div class="meta"><a href="${esc(c.source_url)}" target="_blank" rel="noopener">${esc(c.source_name || c.source_url)}</a>${claimBasis(c)}</div></div>`;
  }).join("")}</div>`;
}
function claimBasis(c) {
  if (!c.effect) return "";
  if (c.tag === "fan_speculation") return ' <span class="pill plain">Shown only, not counted</span>';
  const p = c.player_id ? pl(c.player_id) : null;
  const keys = Object.keys(c.effect).filter(k => k !== "gameweeks");
  const d = p && (p.intel_decisions || []).find(x => keys.includes(x.effect));
  if (!d) return "";
  const used = d.domains.includes(c.domain);
  return used ? ` <span class="pill info" title="How much this changes the numbers">Counts ${Math.round(d.weight * 100)}% · ${esc(d.basis)}</span>`
              : ' <span class="pill plain">Overruled by a newer or confirmed claim</span>';
}
function fixtureChips(outlook) {
  if (!outlook.length) return '<div class="empty">No fixtures in the window.</div>';
  return `<div class="fixtures">${outlook.map(f => `<div class="fx"><b>${f.opp}</b> <span class="muted">${f.home ? "H" : "A"} · GW${f.gw}</span>
    <div>Goals for ${f.xg_for} · against ${f.xg_against}</div><div>Clean sheet ${pct(f.cs)}${f.src === "odds" ? " · odds" : ""}</div>${f.euro ? '<div><span class="pill warn">Europe within 3 days</span></div>' : ""}</div>`).join("")}</div>`;
}

/* ---------- pitch ---------- */
function layoutScouts() {
  const pitch = document.getElementById("pitch");
  const portrait = matchMedia("(max-width: 720px)").matches;
  // seats round the touchline, clockwise from top-left: top row, right side, bottom row, left side
  const spread = (n, a, b) => Array.from({ length: n }, (_, k) => n === 1 ? (a + b) / 2 : a + (b - a) * k / (n - 1));
  const [top, side] = portrait ? [5, 5] : [7, 3];
  const L = portrait ? 12 : 8, Rt = 100 - L, T = portrait ? 9 : 14, B = 100 - T;
  const seats = [
    ...spread(top, L, Rt).map(x => [x, T]),
    ...spread(side + 2, T, B).slice(1, -1).map(y => [portrait ? 88 : 93, y]),
    ...spread(top, Rt, L).map(x => [x, B]),
    ...spread(side + 2, B, T).slice(1, -1).map(y => [portrait ? 12 : 7, y]),
  ];
  pitch.querySelectorAll(".scout").forEach((el, i) => {
    const [x, y] = seats[i % seats.length];
    el.style.left = x + "%"; el.style.top = y + "%";
  });
}
function renderPitch() {
  const pitch = document.getElementById("pitch");
  R.scouts.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "scout"; b.type = "button"; b.dataset.i = i;
    const mine = s.mine.length, free = s.available.filter(id => { const p = pl(id); return p && p.xp_total >= 6; }).length;
    b.setAttribute("aria-label", `${s.label}: ${mine} of your players, ${s.available.length} free agents worth a look`);
    b.innerHTML = headSVG(scoutLook(s.club)) + `<span class="tag"><span class="full">${esc(CLUBS[s.club] ? CLUBS[s.club].short : s.club_name)}</span><span class="short">${s.club}</span></span>` +
      (mine ? `<span class="dot" title="Your players at this club">${mine}</span>` : "");
    b.addEventListener("click", () => openScout(i));
    pitch.appendChild(b);
  });
  layoutScouts();
  addEventListener("resize", layoutScouts);

  const c = R.chief, v = c.verdict.toLowerCase();
  document.getElementById("chief").innerHTML = `
    <button class="chief-btn" type="button" id="chief-btn" aria-label="Open the chief scout's full report">${headSVG(CHIEF_LOOK)}<span class="chief-name">Chief Scout</span></button>
    <div class="bubble" id="chief-bubble"><span class="verdict ${v}">${c.verdict}.</span>${esc(c.speech[0].replace(/^(Hold your nerve this week\.|Make .* this week\.)\s*/, m => m))}
      ${c.speech[1] ? `<span class="line2"> ${esc(c.speech[1])}</span>` : ""}<span class="hint">Tap me for the full report. Tap a club scout for their notes.</span></div>`;
  document.getElementById("chief-btn").addEventListener("click", openChief);
  talk(document.querySelector("#chief .head"), c.speech.slice(0, 2).join(" ").length);
}
let talkTimers = new WeakMap();
function talk(svg, chars) {
  if (!svg) return;
  clearTimeout(talkTimers.get(svg));
  svg.classList.add("talking");
  talkTimers.set(svg, setTimeout(() => svg.classList.remove("talking"), Math.min(9000, 900 + chars * 45)));
}

addEventListener("keydown", e => { if (e.key === "Escape" && !drawer.hidden) closeDrawer(); });

function scoutSays(s) {
  const top = s.top.map(pl).filter(Boolean), free = s.available.map(pl).filter(Boolean);
  const parts = [];
  if (top[0]) parts.push(`${top[0].name} is our best bet over the next ${R.meta.horizon.length} gameweeks at ${f1(top[0].xp_total)} xP.`);
  if (free[0]) parts.push(`On waivers, look at ${free[0].name} (${f1(free[0].xp_total)} xP, starts ${pct(free[0].security)} of games).`);
  else parts.push("Nobody worth having is free at this club.");
  const out = s.outlook;
  if (out.length) { const avgCs = out.reduce((a, f) => a + f.cs, 0) / out.length; parts.push(`Fixtures: ${out.map(fixtureLabel).join(", ")}, average clean-sheet chance ${pct(avgCs)}.`); }
  return parts.join(" ");
}
function openScout(i) {

function openChief() {
  openDrawer(`<div class="drawer-head">${headSVG(CHIEF_LOOK)}<div><h2 id="drawer-title">Chief Scout's report</h2><p>GW${R.meta.next_gw} · ${esc(R.meta.team_name)}</p></div>
    <button class="close" type="button" aria-label="Close">×</button></div>` + chiefReport(true), R.chief.speech.join(" ").length);
}

/* ---------- chief report ---------- */
function moveCard(m, title, note) {
  const i = pl(m.in), o = pl(m.out); if (!i || !o) return "";
  const neg = m.gain < 0 ? " neg" : "";
  return `<div class="card">${title ? `<h3>${title}</h3>` : ""}
    <div class="move" style="margin-top:${title ? 8 : 0}px">
      <div class="side out"><small>Drop</small><div class="pname">${esc(o.name)}</div><div class="muted" style="font-size:13px">${o.team} · ${f1(o.xp_total)} xP</div></div>
      <div class="arrow">→</div>
      <div class="side in"><small>Claim</small><div class="pname">${esc(i.name)}</div><div class="muted" style="font-size:13px">${i.team} · ${f1(i.xp_total)} xP</div></div>
    </div>
    <div class="kv"><span title="Adjusted: model gaps shrunk by ${Math.round((1 - R.chief.rules.gain_shrink) * 100)}% to match how they play out">Gain over ${R.meta.horizon.length} GWs <span class="gain${neg}">${m.gain > 0 ? "+" : ""}${f1(m.gain)}</span></span>${m.gain_view != null ? `<span>${R.chief.view.length}-GW view <b>${m.gain_view > 0 ? "+" : ""}${f1(m.gain_view)}</b></span>` : ""}<span>Next GW <b>${m.gain_next > 0 ? "+" : ""}${f1(m.gain_next)}</b></span>
      <span>Start <b>${pct(i.p_start_next)}</b></span><span>G/A chance <b>${pct(i.p_return_next)}</b></span><span>Set pieces ${setPieceChips(i)}</span></div>
    <div class="kv">${fplBadge(m.fpl)}${m.soft_lock ? '<span class="pill warn">Overrides your soft lock</span>' : ""}${m.bar != null ? `<span>Bar +${m.bar}: ${esc(m.bar_reason || "")}</span>` : ""}</div>
    ${m.meets_threshold === false ? `<div class="kv"><span class="pill plain">Below its +${m.bar} xP bar: watch, don't claim</span></div>` : ""}
    ${m.p_land != null ? `<div class="kv"><span class="pill ${m.p_land >= 0.6 ? "good" : m.p_land >= 0.35 ? "warn" : "bad"}">${pct(m.p_land)} chance he reaches you</span>${m.threats && m.threats.length ? `<span>Likely rivals: <b>${m.threats.map(esc).join(", ")}</b></span>` : ""}</div>` : (m.threats && m.threats.length ? `<div class="kv"><span>Rivals ahead who may want him: <b>${m.threats.map(esc).join(", ")}</b></span></div>` : "")}
    ${m.backups && m.backups.length ? `<div class="kv"><span>If taken first: ${m.backups.map(b => `<b>${esc(pl(b.id).name)}</b> (+${f1(b.gain)}${b.p_land != null ? `, ${pct(b.p_land)} as backup` : ""})`).join(", ")}</span></div>` : ""}
    ${note ? `<p class="muted" style="margin:8px 0 0;font-size:13px">${note}</p>` : ""}</div>`;
}
function xiBlock(xi, newIds) {
  if (!xi) return "";
  const rows = ["FWD", "MID", "DEF", "GKP"].map(pos => `<div class="xi-row">${xi.xi.map(pl).filter(p => p.pos === pos).map(p =>
    `<div class="xi-p${newIds.has(p.id) ? " new" : ""}"><b>${esc(p.name)}</b><span>${f1(p.gws[0].xp)} xP · ${esc(p.gws[0].fixtures.map(fixtureLabel).join(", ") || "Blank")}</span></div>`).join("")}</div>`).join("");
  return `<div class="card"><h3>Suggested XI for GW${R.meta.next_gw} · ${xi.formation} · ${f1(xi.xp)} xP</h3><div class="xi" style="margin-top:10px">${rows}</div>
    <div class="kv"><span>Bench: <b>${xi.bench.map(id => esc(pl(id).name)).join(", ")}</b></span></div></div>`;
}
function chiefReport(inDrawer) {
  const c = R.chief, v = c.verdict.toLowerCase(), H = R.meta.horizon.length;
  const myWaiver = R.league.find(r => r.me), ahead = R.league.filter(r => r.waiver < myWaiver.waiver).sort((a, b) => a.waiver - b.waiver);
  const newIds = new Set(c.moves.map(m => m.in));
  const flags = c.flags.length ? c.flags.map(f => `<li>GW${f.gw}: ${f.double.length ? `double for ${f.double.join(", ")}` : ""}${f.double.length && f.blank.length ? "; " : ""}${f.blank.length ? `blank for ${f.blank.join(", ")}` : ""}</li>`).join("")
    : `<li>No double or blank gameweeks in the published fixtures for the next ${10} gameweeks.</li>`;
  return `
    <div class="card verdict-card"><div class="vbadge ${v}">${c.verdict}</div>
      <div><b>${esc(c.speech[0])}</b><div class="muted" style="font-size:13px">Rules: gains are expected points over GW${R.meta.horizon[0]}–${R.meta.horizon[H - 1]}, shrunk ${Math.round((1 - c.rules.gain_shrink) * 100)}% because the model's gaps run large. A swap must clear <b>+${c.rules.bar_low_demand}</b> when no rival would want the player you drop, <b>+${c.rules.bar_high_demand}</b> when one would. Locked players are never dropped: in Draft, a rival would claim them for the season. Near-ties are settled by the weighted ${c.view.length}-gameweek view.</div></div></div>
    ${c.speech.length > 1 ? `<ul class="plain">${c.speech.slice(1).map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
    ${c.final_claims && !c.final_claims.length && c.final_note ? `<div class="sub">Your decision this week</div><div class="card"><div class="kv" style="margin-top:0"><span class="pill info">Hold: no waiver claims</span></div><p style="margin:8px 0 0">${esc(c.final_note)}</p></div>` : ""}
    ${c.final_claims && c.final_claims.length ? `<div class="sub">Your final waiver list, in this order</div><div class="card">
      ${c.final_claims.map((f, k) => `<div class="claim"><div class="meta"><b style="color:var(--ink)">${k + 1}. Claim ${esc(pl(f.in).name)}</b><span>drop ${esc(pl(f.out).name)}</span>
        <span class="pill ${f.p_land >= 0.6 ? "good" : f.p_land >= 0.35 ? "warn" : "bad"}">${pct(f.p_land)} chance</span><span>${f.gain >= 0 ? "+" : ""}${f1(f.gain)} xP over ${H} GWs</span>${fplBadge(f.fpl)}</div></div>`).join("")}
      ${c.final_note ? `<p class="muted" style="font-size:13px;margin:6px 0 0">${esc(c.final_note)}</p>` : ""}</div>` : ""}
    ${c.moves.length ? `<div class="sub">Waiver claims, in priority order</div><div class="grid2">${c.moves.map((m, k) => moveCard(m, `Claim ${k + 1}`)).join("")}</div>
      <p class="muted" style="font-size:13px">You pick ${ordinal(myWaiver.waiver)} on waivers. ${ahead.length ? `${ahead.map(a => esc(a.team)).join(" and ")} pick${ahead.length === 1 ? "s" : ""} before you.` : "Nobody picks before you."}
      This order was chosen by simulating 3,000 waiver runs: each round, teams pick in waiver order, using what each rival needs and how often they claim. Expected gain from these claims: <b>+${f1(c.claims_expected_gain)} xP</b>. List the backups too.</p>` : ""}
    <div class="sub">Two lenses on the waiver pile</div>
    <div class="grid2">
      ${c.short_term ? moveCard(c.short_term, "Short term · high ceiling", "Best attacking upside on waivers for next gameweek: expected points plus extra weight on goal and assist chances.") : '<div class="empty">No short-term option on waivers.</div>'}
      ${c.medium_term ? moveCard(c.medium_term, "Medium term · steady", `Most expected points over ${H} gameweeks among free agents who start at least 75% of games.`) : '<div class="empty">No steady option on waivers.</div>'}
    </div>
    <div class="sub">Trade ideas</div>${tradesBlock(c.trades)}
    <div class="sub">Buy-low watchlist</div>${watchBlock(c.watchlist)}
    <div class="sub">Line-up</div>${xiBlock(c.xi_after || c.xi_now, newIds)}
    <div class="sub">Double and blank gameweeks</div><ul class="plain">${flags}</ul>
    <div class="sub">How sure is this?</div>
    <ul class="plain">
      <li>Bookmaker odds used for <b>${R.meta.odds_fixtures}</b> of the next fixtures${R.meta.odds_sources && R.meta.odds_sources.length ? ` (${R.meta.odds_sources.map(esc).join(", ")})` : ""}. ${R.meta.odds_fixtures ? "" : "Odds for this round aren't published yet, so team goal expectancy comes from season xG and goals."}
        ${R.meta.odds_api && R.meta.odds_api.enabled ? (R.meta.odds_api.error ? ` The Odds API failed (${esc(R.meta.odds_api.error)}).` : (R.meta.odds_api.remaining != null ? ` The Odds API credits left this month: ${esc(R.meta.odds_api.remaining)}.` : "")) : " The Odds API isn't connected yet: add ODDS_API_KEY to the environment."}</li>
      <li>Field intel received from <b>${R.meta.intel_clubs}</b> of 20 junior scouts.</li>
      <li>Data refreshed ${fmtDate(R.meta.generated, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })} UK time.</li>
    </ul>`;
}
function fplBadge(v) {
  if (v === "agrees") return '<span class="pill good" title="FPL\'s own expected points also favour this swap next gameweek">FPL\'s model agrees</span>';
  if (v === "disagrees") return '<span class="pill bad" title="FPL\'s own expected points favour the player you would drop next gameweek">FPL\'s model disagrees</span>';
  if (v === "neutral") return '<span class="pill plain">FPL\'s model: too close to call</span>';
  return "";
}
function tradesBlock(trades) {
  if (!trades || !trades.length) return `<div class="empty">No 1-for-1 trade gains you +${R.chief.rules.bar_high_demand} xP (adjusted) without leaving the other manager worse off.</div>`;
  return `<div class="grid2">${trades.map(t => { const g = pl(t.give), r = pl(t.get); return `<div class="card">
    <div class="move"><div class="side out"><small>Offer</small><div class="pname">${esc(g.name)}</div><div class="muted" style="font-size:13px">${g.team} · ${f1(g.xp_total)} xP</div></div>
    <div class="arrow">⇄</div><div class="side in"><small>Ask for</small><div class="pname">${esc(r.name)}</div><div class="muted" style="font-size:13px">${r.team} · ${f1(r.xp_total)} xP</div></div></div>
    <div class="kv"><span>With <b>${esc(t.with)}</b></span><span>Your best XI <span class="gain">+${f1(t.gain_me)}</span></span><span>Their best XI <b>${t.gain_them >= 0 ? "+" : ""}${f1(t.gain_them)}</b></span></div></div>`; }).join("")}</div>
    <p class="muted" style="font-size:13px">Gains are best-XI expected points over the next ${R.meta.horizon.length} gameweeks. A trade they don't lose on is easier to pitch.</p>`;
}
function watchBlock(w) {
  if (!w || !w.length) return '<div class="empty">Nobody worth stashing right now.</div>';
  return `<div class="card">${w.map(x => { const p = pl(x.id); return `<div class="claim"><div class="meta"><span class="pill ${x.reason === "injured" ? "bad" : "info"}">${x.reason === "injured" ? "Injured, quality when fit" : "Recently dropped"}</span><b style="color:var(--ink)">${esc(p.name)}</b><span>${p.team} · ${p.pos}</span></div>
    <p>${x.reason === "injured" ? `About ${f1(x.fit_xp)} xP a game once fit.` : `${f1(p.xp_total)} xP over ${R.meta.horizon.length} gameweeks.`} ${esc(x.note || "")}</p></div>`; }).join("")}</div>`;
}
function ordinal(n) { return n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th"); }

/* ---------- tabs ---------- */
const TABS = [
  ["report", "Chief's report", () => chiefReport(false)],
  ["squad", "My squad", () => {
    const ids = R.squad.slice().sort((a, b) => ["GKP", "DEF", "MID", "FWD"].indexOf(pl(a).pos) - ["GKP", "DEF", "MID", "FWD"].indexOf(pl(b).pos) || pl(b).xp_total - pl(a).xp_total);
    return `<p class="muted" style="margin-top:0">Projected ${f1(R.chief.squad_xp)} xP across your 15 over the next ${R.meta.horizon.length} gameweeks.</p>` + playerTable(ids, { owner: false });
  }],
  ["waivers", "Waiver pool", () => `<div class="filters" id="posf">${["All", "GKP", "DEF", "MID", "FWD"].map((p, i) => `<button type="button" data-pos="${p}" aria-pressed="${i === 0}">${p}</button>`).join("")}</div><div id="pool"></div>`],
  ["league", "League", () => `<div class="tbl-wrap"><table><thead><tr><th class="r">Rank</th><th>Team</th><th>Manager</th><th class="r">GW${R.meta.last_finished_gw}</th><th class="r">Total</th><th class="r">Waiver pick</th></tr></thead><tbody>
    ${R.league.map(r => `<tr${r.me ? ' class="me"' : ""}><td class="r">${r.rank}</td><td><b>${esc(r.team)}</b></td><td>${esc(r.manager)}</td><td class="r">${r.gw}</td><td class="r">${r.total}</td><td class="r">${r.waiver}</td></tr>`).join("")}</tbody></table></div>
    <p class="muted" style="font-size:13px">Waiver pick 1 claims first. Priority runs from the bottom of the table.</p>
    <div class="sub">Rival habits and likely claims</div>
    <div class="tbl-wrap"><table><thead><tr><th>Team</th><th class="r">Pick</th><th class="r">Claims made</th><th class="r">Won</th><th class="r" title="Share of weeks they put in a claim">Active</th><th>Favourite position</th><th>Likely claims this week</th></tr></thead><tbody>
    ${R.league.slice().sort((a, b) => a.waiver - b.waiver).map(r => { const h = r.habits || {}; return `<tr${r.me ? ' class="me"' : ""}><td><b>${esc(r.team)}</b></td><td class="r">${r.waiver}</td><td class="r">${h.claims ?? "–"}</td><td class="r">${h.claims_won ?? "–"}</td><td class="r">${pct(h.p_active)}</td><td>${esc(h.favourite_position || "–")}</td>
      <td class="news">${r.me ? "You" : (r.likely_claims || []).map(c => `${esc(pl(c.id).name)} (${pct(c.prob)})`).join(", ") || "Nothing obvious"}</td></tr>`; }).join("")}</tbody></table></div>
    <p class="muted" style="font-size:13px">Likely claims compare each rival's weakest player in each position with the free agents, then scale by how often that manager actually claims. Built from the league's full transaction history.</p>`],
  ["track", "Track record", trackRecord],
  ["method", "Method & sources", method],
];
function trackRecord() {
  const t = R.track;
  const stats = `<div class="stat-row">
    <div class="stat"><b>${t.graded_moves}</b><span>Moves graded</span></div>
    <div class="stat"><b>${t.hit_rate == null ? "–" : pct(t.hit_rate)}</b><span>Moves that paid off</span></div>
    <div class="stat"><b>${t.graded_moves ? (t.predicted_gain > 0 ? "+" : "") + f1(t.predicted_gain) : "–"}</b><span>Predicted gain (pts)</span></div>
    <div class="stat"><b>${t.graded_moves ? (t.actual_gain > 0 ? "+" : "") + f1(t.actual_gain) : "–"}</b><span>Actual gain (pts)</span></div></div>`;
  const rows = t.entries.slice().reverse().map(e => `<div class="card" style="margin-top:10px"><h3>GW${e.gw} · ${e.verdict}</h3>
    <div class="kv"><span>${e.complete ? "Graded" : e.gws_scored.length ? `Part-graded (GW${e.gws_scored.join(", ")})` : "Waiting for matches"}</span></div>
    ${e.moves.length ? `<ul class="plain">${e.moves.map(m => `<li>${esc(m.out)} → <b>${esc(m.in)}</b>: predicted +${f1(m.pred_gain)} xP${m.actual_gain != null ? `, actual ${m.actual_gain > 0 ? "+" : ""}${m.actual_gain} pts` : ""} ${m.followed ? '<span class="pill good">You made it</span>' : '<span class="pill plain">Not made</span>'}</li>`).join("")}</ul>` : ""}
    ${e.hold_check ? `<p class="muted">Hold check: ${esc(e.hold_check.best_waiver)} scored ${e.hold_check.waiver_pts} vs ${esc(e.hold_check.your_player)} ${e.hold_check.your_pts}.</p>` : ""}</div>`).join("");
  const a = R.accuracy;
  const acc = a ? `<div class="sub">How accurate is the model?</div>
    <div class="stat-row">
      <div class="stat"><b>${a.mae}</b><span>Avg error, pts per player</span></div>
      <div class="stat"><b>${a.mae_ppg}</b><span>Same for points-per-game</span></div>
      <div class="stat"><b>${f1(a.top30_actual)}</b><span>Pts scored by model's top 30</span></div>
      <div class="stat"><b>${f1(a.top30_naive)}</b><span>Pts by points-per-game top 30</span></div></div>
    <p class="muted" style="font-size:13px">Replayed GW${a.gameweeks[0]}–${a.gameweeks[1]} using only data from before each gameweek (${a.players_scored.toLocaleString()} player predictions). The replay assumes everyone was fit, because past injury news isn't available, so live predictions should do slightly better. Lower error is better.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Predicted band</th><th class="r">Players</th><th class="r">Predicted avg</th><th class="r">Actual avg</th></tr></thead><tbody>
      ${a.calibration.map(b => `<tr><td>${b.band} xP</td><td class="r">${b.n}</td><td class="r">${f1(b.pred)}</td><td class="r">${f1(b.actual)}</td></tr>`).join("")}</tbody></table></div>` : "";
  const src = Object.entries(R.sources_reliability || {});
  const rel = `<div class="sub">Scout source reliability</div>${src.length ? `<div class="tbl-wrap"><table><thead><tr><th>Website</th><th class="r">Claims graded</th><th class="r">Right</th></tr></thead><tbody>${src.sort((x, y) => y[1].total - x[1].total).map(([d, v]) => `<tr><td>${esc(d)}</td><td class="r">${v.total}</td><td class="r">${pct(v.hits / v.total)}</td></tr>`).join("")}</tbody></table></div>`
    : '<div class="empty">Starts after GW11: each website\'s start and availability claims get checked against what happened, and reliable sites then count for more.</div>'}`;
  return acc + `<div class="sub">Recommendations</div>` + stats + `<p class="muted" style="font-size:13px">Each week's advice is saved before the deadline. Once its ${R.meta.horizon.length} gameweeks finish, every recommended swap is scored on real points: did the player claimed outscore the player dropped?</p>` + rows + rel;
}
function method() {
  return `<div class="grid2"><div class="card"><h3>Expected points</h3><ul class="plain">
      <li>Minutes: chance of starting and expected minutes from the last six matches, weighted to recent games, then cut by injury news, suspensions and loan rules. Start chances drop ${Math.round((1 - R.model_params.euro_rotation) * 100)}% when a European match is within 3 days, and become less certain for 3 gameweeks after a manager change.</li>
      <li>Team goals: from published match odds when available (70%), otherwise from season xG and goals for and against, with home advantage.</li>
      <li>Player goals and assists: xG and xA per 90, blending the season with the last six matches (${Math.round(R.model_params.recent_weight * 100)}% recent), scaled by the fixture.</li>
      <li>Clean sheets, goals conceded, saves, bonus, defensive contributions and cards use your league's own scoring settings.</li>
      <li>Decisions: 3-gameweek gains, shrunk ${Math.round((1 - R.chief.rules.gain_shrink) * 100)}% to match reality (replays showed a predicted 6.4 gap came out at 4.9). The bar to swap depends on what you'd lose: +${R.chief.rules.bar_low_demand} if no rival would claim the player you drop, +${R.chief.rules.bar_high_demand} if one would. Locked players are never dropped. A weighted ${R.chief.view.length}-gameweek view breaks near-ties. Replays found little difference between 1-, 3- and 5-gameweek horizons.</li>
      <li>Second opinion: FPL's own expected points are shown beside ours, and each claim says whether FPL's model agrees.</li>
      <li>Scout intel then adjusts availability, start chances, penalty duty or output. The newest confirmed claim wins outright. Rumours count 25% from one website and 75% when two or more independent websites agree. Fan speculation is shown but never counted. Each website's past accuracy scales its weight.</li>
      <li>Ranges come from 2,000 simulated runs of each match: 80% of outcomes fall inside.</li>
      <li>Settings were tuned by replaying past gameweeks. See the Track record tab.</li></ul></div>
    <div class="card"><h3>Sources</h3><ul class="plain">${R.meta.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>: ${esc(s.use)}</li>`).join("")}
      <li>Understat: planned for extra xG detail. The site was down when this report was built.</li></ul>
      <p class="muted" style="font-size:13px">No paid services and no scraping of bookmaker sites.</p></div></div>`;
}
function renderTabs() {
  const tabs = document.getElementById("tabs"), panel = document.getElementById("panel");
  let saved = "report"; try { saved = localStorage.getItem("scout-tab") || "report"; } catch (e) {}
  if (!TABS.find(t => t[0] === saved)) saved = "report";
  tabs.innerHTML = TABS.map(t => `<button class="tab" role="tab" type="button" data-t="${t[0]}" aria-selected="${t[0] === saved}">${t[1]}</button>`).join("");
  const show = key => {
    tabs.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.t === key));
    panel.innerHTML = TABS.find(t => t[0] === key)[2]();
    try { localStorage.setItem("scout-tab", key); } catch (e) {}
    if (key === "waivers") wirePool();
  };
  tabs.addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) show(b.dataset.t); });
  show(saved);
}
function wirePool() {
  const draw = pos => { document.getElementById("pool").innerHTML = playerTable(R.pool_top.filter(id => pos === "All" || pl(id).pos === pos).slice(0, 30), { owner: false }); };
  document.getElementById("posf").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#posf button").forEach(x => x.setAttribute("aria-pressed", x === b));
    draw(b.dataset.pos);
  });
  draw("All");
}

/* ---------- header ---------- */
function renderHeader() {
  const m = R.meta, me = R.league.find(r => r.me);
  document.getElementById("eyebrow").textContent = `${m.league} · GW${m.next_gw} · ${ordinal(me.rank)} of ${R.league.length}`;
  document.getElementById("title").textContent = `${m.team_name} Scouting Room`;
  // your own decision deadline: the Thursday 18:00 before waivers process
  const w = new Date(m.waivers);
  const thu = new Date(w); thu.setUTCDate(w.getUTCDate() - ((w.getUTCDay() + 7 - 4) % 7 || 0));
  const thuLabel = fmtDate(thu.toISOString(), { weekday: "short", day: "numeric", month: "short" }) + ", 18:00";
  const opts = { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" };
  document.getElementById("clocks").innerHTML = `
    <div class="clock"><span>Report updated</span><b>${fmtDate(m.generated, opts)}</b></div>
    <div class="clock hot"><span>Your decision</span><b>${thuLabel}</b></div>
    <div class="clock"><span>Waivers process</span><b>${fmtDate(m.waivers, opts)}</b></div>
    <div class="clock"><span>GW${m.next_gw} deadline</span><b>${fmtDate(m.deadline, opts)}</b></div>`;
  document.getElementById("footer").innerHTML = `Report built ${fmtDate(m.generated, opts)} UK time from free public data. Expected points (xP) are estimates, not promises.`;
}

renderHeader();
renderPitch();
renderTabs();
})();
</script>
